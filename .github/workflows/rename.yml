name: Rename file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: mv -f turukamesuan-simiyureta2.html index.html
      - name: Commit renamed file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename turukamesuan-simiyureta2.html to index.html" || echo "No changes to commit"
          git push

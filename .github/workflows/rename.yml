name: rename

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename simulator to index.html
        run: |
          mv turukamesuan-simiyureta2.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html turukamesuan-simiyureta2.html
          git commit -m "Rename turukamesuan-simiyureta2.html to index.html"
          git push
